[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-robosim"
version = "0.2.0"
description = "Sim-to-real gauntlet for manipulation controllers on reaf-sim and mujoco_playground DeviceLayers."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "absl-py",
    "dm-env",
    "mujoco>=3.3.0",
    "mujoco-playground",
    "numpy>=1.26.0",
    "torch",
]

[project.scripts]
robosim-gauntlet = "robosim_gauntlet.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
